version: 2

models:
  - name: mart_finance__monthly_revenue
    description: Authoritative monthly MRR/ARR by Salesforce account
    columns:
      - name: account_id
        tests: [not_null]
      - name: revenue_month
        tests: [not_null]
      - name: mrr_usd
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: arr_usd
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [account_id, revenue_month]

  - name: mart_sales__pipeline_snapshot
    description: Daily open pipeline snapshot
    columns:
      - name: opportunity_id
        tests: [not_null, unique]
      - name: amount_usd
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  - name: mart_product__daily_engagement
    columns:
      - name: activity_date
        tests: [not_null, unique]
