semantic_models:
  - name: revenue_metrics
    model: ref('semantic__revenue_kpis')
    defaults:
      agg_time_dimension: revenue_month
    entities:
      - name: account
        type: primary
        expr: account_id
    dimensions:
      - name: revenue_month
        type: time
        type_params:
          time_granularity: month
      - name: account_id
        type: categorical
    measures:
      - name: mrr
        agg: sum
        expr: mrr_usd
        description: Monthly Recurring Revenue in USD
      - name: arr
        agg: sum
        expr: arr_usd
        description: Annual Recurring Revenue (MRR x 12 for monthly subs)

  - name: sales_metrics
    model: ref('semantic__sales_kpis')
    defaults:
      agg_time_dimension: snapshot_date
    entities:
      - name: opportunity
        type: primary
        expr: opportunity_id
    dimensions:
      - name: snapshot_date
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: pipeline_value
        agg: sum
        expr: amount_usd
      - name: weighted_pipeline
        agg: sum
        expr: weighted_amount_usd

  - name: sales_win_rate_metrics
    model: ref('semantic__sales_win_rate')
    defaults:
      agg_time_dimension: fiscal_quarter
    entities:
      - name: fiscal_period
        type: primary
        expr: fiscal_quarter
    dimensions:
      - name: fiscal_quarter
        type: time
        type_params:
          time_granularity: quarter
    measures:
      - name: win_rate
        agg: average
        expr: win_rate
        agg_time_dimension: fiscal_quarter

  - name: marketing_metrics
    model: ref('semantic__marketing_kpis')
    defaults:
      agg_time_dimension: activity_month
    entities:
      - name: marketing_period
        type: primary
        expr: activity_month
    dimensions:
      - name: activity_month
        type: time
        type_params:
          time_granularity: month
    measures:
      - name: marketing_spend
        agg: sum
        expr: marketing_spend
      - name: new_customers
        agg: sum
        expr: new_customers
      - name: ad_spend
        agg: sum
        expr: ad_spend
      - name: attributed_revenue
        agg: sum
        expr: attributed_revenue

  - name: finance_metrics
    model: ref('semantic__finance_kpis')
    defaults:
      agg_time_dimension: activity_month
    entities:
      - name: finance_period
        type: primary
        expr: activity_month
    dimensions:
      - name: activity_month
        type: time
        type_params:
          time_granularity: month
    measures:
      - name: revenue
        agg: sum
        expr: revenue
      - name: cogs
        agg: sum
        expr: cogs

  - name: product_metrics
    model: ref('semantic__product_kpis')
    defaults:
      agg_time_dimension: activity_date
    entities:
      - name: product_day
        type: primary
        expr: activity_date
    dimensions:
      - name: activity_date
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: dau
        agg: sum
        expr: dau
      - name: mau
        agg: sum
        expr: mau

  - name: hr_metrics
    model: ref('semantic__hr_kpis')
    defaults:
      agg_time_dimension: activity_month
    entities:
      - name: hr_period
        type: primary
        expr: activity_month
    dimensions:
      - name: activity_month
        type: time
        type_params:
          time_granularity: month
    measures:
      - name: headcount
        agg: sum
        expr: headcount
      - name: terminations
        agg: sum
        expr: terminations
      - name: avg_headcount
        agg: average
        expr: headcount

metrics:
  # --- Revenue ---
  - name: arr
    label: Annual Recurring Revenue
    type: simple
    type_params:
      measure: arr

  - name: mrr
    label: Monthly Recurring Revenue
    type: simple
    type_params:
      measure: mrr

  # --- Sales ---
  - name: pipeline_value
    label: Open Pipeline Value
    type: simple
    type_params:
      measure: pipeline_value

  - name: win_rate
    label: Win Rate
    type: simple
    type_params:
      measure: win_rate

  # --- Marketing (base metrics for derived) ---
  - name: marketing_spend
    label: Marketing Spend
    type: simple
    type_params:
      measure: marketing_spend

  - name: new_customers
    label: New Customers
    type: simple
    type_params:
      measure: new_customers

  - name: ad_spend
    label: Ad Spend
    type: simple
    type_params:
      measure: ad_spend

  - name: attributed_revenue
    label: Attributed Revenue
    type: simple
    type_params:
      measure: attributed_revenue

  - name: cac
    label: Customer Acquisition Cost
    type: derived
    type_params:
      expr: marketing_spend / nullif(new_customers, 0)
      metrics:
        - name: marketing_spend
        - name: new_customers
    description: Marketing spend divided by new customers (MQL proxy until Stripe mart wired)

  - name: roas
    label: Return on Ad Spend
    type: derived
    type_params:
      expr: attributed_revenue / nullif(ad_spend, 0)
      metrics:
        - name: attributed_revenue
        - name: ad_spend
    description: Attributed revenue divided by ad spend

  # --- Finance ---
  - name: revenue
    label: Revenue
    type: simple
    type_params:
      measure: revenue

  - name: cogs
    label: Cost of Goods Sold
    type: simple
    type_params:
      measure: cogs

  - name: gross_margin_pct
    label: Gross Margin Percentage
    type: derived
    type_params:
      expr: (revenue - cogs) / nullif(revenue, 0)
      metrics:
        - name: revenue
        - name: cogs

  # --- Product ---
  - name: dau
    label: Daily Active Users
    type: simple
    type_params:
      measure: dau

  - name: mau
    label: Monthly Active Users
    type: simple
    type_params:
      measure: mau

  # --- HR ---
  - name: headcount
    label: Active Headcount
    type: simple
    type_params:
      measure: headcount

  - name: terminations
    label: Terminations
    type: simple
    type_params:
      measure: terminations

  - name: attrition_rate
    label: Attrition Rate
    type: derived
    type_params:
      expr: terminations / nullif(headcount, 0)
      metrics:
        - name: terminations
        - name: headcount
    description: Terminations divided by headcount

  # Future metrics (add semantic models first):
  # - time_to_hire_days, retention_rate, feature_adoption_pct
