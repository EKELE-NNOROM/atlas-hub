# CI/CD profile — copied to profiles.yml in GitHub Actions.
#
# Uses placeholder defaults so `dbt parse` and `dbt compile` succeed without
# real Snowflake credentials. Set repository secrets to enable `dbt build`.
#
# Placeholders (no warehouse connection):
#   account: placeholder.us-east-1
#   user:    PLACEHOLDER_DBT_USER
#
atlas_hub:
  target: "{{ env_var('DBT_TARGET', 'ci') }}"
  outputs:
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'placeholder.us-east-1') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'PLACEHOLDER_DBT_USER') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'ATLAS_TRANSFORMER') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'ANALYTICS_DEV') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'WH_ETL_DEV') }}"
      schema: PUBLIC
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '/tmp/snowflake_key.p8') }}"
      threads: 4

    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'placeholder.us-east-1') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'PLACEHOLDER_DBT_USER') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'ATLAS_TRANSFORMER') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'ANALYTICS_PROD') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'WH_ETL_PROD') }}"
      schema: PUBLIC
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '/tmp/snowflake_key.p8') }}"
      threads: 8

    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'placeholder.us-east-1') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'PLACEHOLDER_DBT_USER') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'ATLAS_TRANSFORMER') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'ANALYTICS_DEV') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'WH_ETL_DEV') }}"
      schema: PUBLIC
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '/tmp/snowflake_key.p8') }}"
      threads: 4
