# Atlas Hub — local development stack
#
# Quick start (mock mode, no Snowflake required):
#   copy .env.example .env
#   docker compose up -d
#   open http://localhost:8080/docs
#
# With Snowflake + dbt:
#   docker compose --profile tools run --rm dbt build --target docker
#
# With local Airflow:
#   docker compose --profile airflow up -d

name: atlas-hub

x-common-env: &common-env
  ATLAS_ENV: ${ATLAS_ENV:-dev}
  ATLAS_ENVIRONMENT: ${ATLAS_ENVIRONMENT:-dev}
  ATLAS_JWT_SECRET: ${ATLAS_JWT_SECRET:-local-dev-secret-change-me}
  ATLAS_MOCK_DATA: ${ATLAS_MOCK_DATA:-true}
  ATLAS_DISABLE_AUTH: ${ATLAS_DISABLE_AUTH:-true}
  ATLAS_SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
  ATLAS_SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
  ATLAS_SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
  ATLAS_SNOWFLAKE_PRIVATE_KEY_PATH: ${ATLAS_SNOWFLAKE_PRIVATE_KEY_PATH:-/secrets/snowflake_key.p8}
  ATLAS_SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-WH_BI_DEV}

services:
  metrics-api:
    build:
      context: .
      dockerfile: docker/metrics-api/Dockerfile
    ports:
      - "${METRICS_API_PORT:-8080}:8080"
    environment:
      <<: *common-env
    volumes:
      - ./semantic-layer/api:/app
      - ${SNOWFLAKE_PRIVATE_KEY_HOST_PATH:-./docker/secrets}:/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  dbt:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/dbt/Dockerfile
    environment:
      DBT_TARGET: ${DBT_TARGET:-docker}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-ATLAS_TRANSFORMER}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-ANALYTICS_DEV}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-WH_ETL_DEV}
    volumes:
      - ./dbt:/usr/app/dbt
      - dbt-target:/usr/app/dbt/target
      - dbt-logs:/usr/app/dbt/logs
    working_dir: /usr/app/dbt
    entrypoint: ["dbt"]
    command: ["--help"]

  dbt-shell:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/dbt/Dockerfile
    environment:
      DBT_TARGET: ${DBT_TARGET:-docker}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-ATLAS_TRANSFORMER}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-ANALYTICS_DEV}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-WH_ETL_DEV}
    volumes:
      - ./dbt:/usr/app/dbt
      - dbt-target:/usr/app/dbt/target
      - dbt-logs:/usr/app/dbt/logs
    working_dir: /usr/app/dbt
    entrypoint: ["/bin/bash", "-c"]
    command: ["dbt deps && exec bash"]
    stdin_open: true
    tty: true

  postgres:
    profiles: [airflow]
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    profiles: [airflow]
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOavdmXpBHwT7qMhLQZUyqKVTjKvqZJhE=}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./dbt:/opt/airflow/dbt
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "$${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD}" \
          --firstname Admin --lastname User \
          --role Admin --email admin@local.test || true

  airflow-webserver:
    profiles: [airflow]
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "${AIRFLOW_PORT:-8081}:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOavdmXpBHwT7qMhLQZUyqKVTjKvqZJhE=}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      ATLAS_ENV: ${ATLAS_ENV:-dev}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./dbt:/opt/airflow/dbt
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    profiles: [airflow]
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOavdmXpBHwT7qMhLQZUyqKVTjKvqZJhE=}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      ATLAS_ENV: ${ATLAS_ENV:-dev}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./dbt:/opt/airflow/dbt
    command: scheduler
    restart: unless-stopped

  localstack:
    profiles: [localstack]
    image: localstack/localstack:3.0
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,lambda,secretsmanager
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - localstack-data:/var/lib/localstack
      - ./lambda:/opt/code/lambda:ro

volumes:
  dbt-target:
  dbt-logs:
  postgres-data:
  localstack-data:
