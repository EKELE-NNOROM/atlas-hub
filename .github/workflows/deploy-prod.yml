# Optional: run manually when Snowflake + AWS credentials are configured.
# Not required for local development or portfolio use.

name: Deploy (manual)

on:
  workflow_dispatch:

jobs:
  deploy-dbt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-snowflake==1.7.4

      - name: Configure dbt profile
        run: cp profiles.ci.yml profiles.yml

      - name: Setup Snowflake credentials
        id: snowflake
        working-directory: .
        run: bash scripts/ci/setup-dbt-env.sh
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Fail if Snowflake not configured
        if: steps.snowflake.outputs.snowflake_configured != 'true'
        run: |
          echo "Add SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER, and SNOWFLAKE_PRIVATE_KEY secrets first."
          exit 1

      - name: dbt deploy
        run: dbt deps --profiles-dir . && dbt build --profiles-dir . --target prod
        env:
          DBT_TARGET: prod
          SNOWFLAKE_DATABASE: ANALYTICS_PROD
          SNOWFLAKE_WAREHOUSE: WH_ETL_PROD

  deploy-airflow:
    needs: deploy-dbt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check AWS credentials
        id: aws
        run: bash scripts/ci/setup-aws-env.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Fail if AWS not configured
        if: steps.aws.outputs.aws_configured != 'true'
        run: |
          echo "Add AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets first."
          exit 1

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync DAGs to MWAA bucket
        run: aws s3 sync airflow/dags/ s3://atlas-airflow-prod/dags/ --delete
