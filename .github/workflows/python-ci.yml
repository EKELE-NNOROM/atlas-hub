name: Python CI

on:
  pull_request:
    paths:
      - 'airflow/**'
      - 'lambda/**'
      - 'semantic-layer/**'
      - 'databricks/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov ruff
          pip install -r airflow/requirements.txt
          pip install -r semantic-layer/api/requirements.txt

      - name: Ruff lint
        run: ruff check airflow/ lambda/ semantic-layer/

      - name: Unit tests
        run: pytest tests/ -v --cov=lambda --cov=semantic-layer
        continue-on-error: true

  airflow-dag-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install apache-airflow==2.8.1
      - name: Validate DAG import
        run: python scripts/validate_dags.py
